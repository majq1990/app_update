is_checked_successful: false
webs:
- log_dir: WEB-INF/log
  master:
  - check_uri: /eUrbanMIS/main.htm
    group: egova
    host: 10.2.0.172
    service_port: 8081
    start_cmd: systemctl start tomcat-MIS
    stop_cmd: systemctl stop tomcat-MIS
    user: egova
    web_path: /egova/web/eUrbanMIS
