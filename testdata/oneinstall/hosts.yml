# ansible hosts文件， 此hosts文件仅供ansible使用，保存所有ansible受控节点信息。
# 主机名是自动生成，不代表实际的主机名称。
all:
  hosts:
    node1:
      ansible_ssh_host: 172.21.133.221
      ansible_ssh_port: "22"
    node2:
      ansible_ssh_host: 172.21.133.222
      ansible_ssh_port: "22"
    node3:
      ansible_ssh_host: 172.21.144.107
      ansible_ssh_port: "22"
  children:
    # mysql服务器，部署完mysql后记录一条，便于后续批量更新等操作。
    mysql:
      hosts:
        node3: ""
    # redis服务器
    redis:
      hosts:
        node3: ""
        node1: ""
    # minio服务器
    minio:
      hosts:
        node2: ""
    # nginx服务器
    nginx:
      hosts:
        node3: ""
    # linglong, 一个节点多个linglong，如何滚动更新
    linglong:
      hosts:
    wukong:
      hosts:
    dex:
      hosts:
    httpfileservice:
      hosts:
    gisserver:
      hosts:
    zookeeper:
      hosts:
        node3: ""
        node1: ""
    kafka:
      hosts:
        node2: ""
    usercenter:
      hosts:
    xuanzang:
      hosts:
    eurbanpro:
      hosts:
    postgresql:
      hosts:
        node3: ""
    TDengine:
      hosts:
        node3: ""
    nacos:
      hosts:
        node3: ""
    TDengine3:
      hosts:
        node1: ""
